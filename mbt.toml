schema = 3

[project]
name = "lua370"
version = "1.2.0-dev"
kind = "application"

[toolchain]
cc370 = "1.4.0"
libc370 = "2.4.1"
mbt = "3.0"

[build]
cflags = ["-O0", "-DLUA_USE_C89", "-DLUA_USE_JUMPTABLE=0", "-DLUA_USE_CTYPE=1"]

[module.LUA]
rent = false
reus = false
sources = ["app/lua.c"]

[module.LUAC]
rent = false
reus = false
sources = ["app/luac.c"]

[internal]
sources = ["src/*.c"]

[lib]
name = "liblua370"
sources = ["src/*.c"]
headers = [
	"include/lua.h",
	"include/luaconf.h",
	"include/lualib.h",
	"include/lauxlib.h",
	"include/lua.hpp",
	"include/lprefix.h",
]
